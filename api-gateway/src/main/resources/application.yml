server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: trip-planner-service
              uri: ${TRIP_PLANNER_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/travel/**
            - id: location-service
              uri: ${LOCATION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/locations/**
            - id: weather-service
              uri: ${WEATHER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/weather/**
            - id: currency-service
              uri: ${CURRENCY_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/currency/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents,retries,retryevents
  endpoint:
    circuitbreakers:
      enabled: true
    circuitbreakerevents:
      enabled: true
    retries:
      enabled: true
    retryevents:
      enabled: true
